name: Ultra Clear Windows and macOS installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      VERSION_NUM: v1.7.7-1-20261124
      XMAKE_GLOBALDIR: D:\xmake_global
    steps:
      - name: Checkout the pinned release with keymap patch
        uses: actions/checkout@v5
        with:
          ref: a925e70deca48f89ac1888fc57003ee215adf9d3
          persist-credentials: false
          submodules: recursive
      - name: Apply and verify source patch
        shell: bash
        run: |
          git apply --check crossdesk-modifier-mapping.patch
          git apply crossdesk-modifier-mapping.patch
          git apply --check crossdesk-strict-clarity.patch
          git apply crossdesk-strict-clarity.patch
          git -C deps/submodules/minirtc apply --check ../../../minirtc-strict-clarity.patch
          git -C deps/submodules/minirtc apply ../../../minirtc-strict-clarity.patch
          git diff --check
          git -C deps/submodules/minirtc diff --check
      - name: Cache Xmake dependencies
        uses: actions/cache@v5
        with:
          path: D:\xmake_global\.xmake\packages
          key: crossdesk-keymap-win-x64-deps-v1
      - name: Ensure Xmake
        uses: ./.github/actions/ensure-xmake
        with:
          minimum-version: "3.1.1"
      - name: Update Xmake repos
        run: xmake repo -u
      - name: Prepare installer plugins
        shell: powershell
        run: |
          $nsisPluginDir = "C:\Program Files (x86)\NSIS\Plugins\x86-unicode"
          $url = "https://github.com/DigitalMediaServer/NSIS-INetC-plugin/releases/download/v1.0.5.7/InetC.zip"
          $out = "$env:RUNNER_TEMP\InetC.zip"
          Invoke-WebRequest -Uri $url -OutFile $out
          Expand-Archive $out -DestinationPath "$env:RUNNER_TEMP\InetC" -Force
          Copy-Item "$env:RUNNER_TEMP\InetC\x86-unicode\INetC.dll" $nsisPluginDir -Force
          Copy-Item "apps\desktop\scripts\windows\nsProcess.dll" $nsisPluginDir -Force
      - name: Build Windows x64
        run: |
          xmake f -p windows -a x64 -m release --CROSSDESK_VERSION=$env:VERSION_NUM --USE_CUDA=false -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake b -vy crossdesk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package unsigned installer
        shell: pwsh
        run: |
          & "apps\desktop\scripts\windows\pkg_x64.ps1" $env:VERSION_NUM
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = "apps\desktop\scripts\windows\crossdesk-win-x64-$env:VERSION_NUM.exe"
          if (!(Test-Path $exe)) { throw "Installer missing: $exe" }
          Rename-Item $exe "CrossDesk-UltraClear-v1.7.7-windows-x64.exe"
          Get-FileHash "apps\desktop\scripts\windows\CrossDesk-UltraClear-v1.7.7-windows-x64.exe" -Algorithm SHA256
      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: CrossDesk-UltraClear-v1.7.7-windows-x64
          path: apps/desktop/scripts/windows/CrossDesk-UltraClear-v1.7.7-windows-x64.exe
          if-no-files-found: error
          retention-days: 14
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            architecture: arm64
            script: pkg_arm64.sh
          - arch: x64
            runner: macos-26-intel
            architecture: x86_64
            script: pkg_x64.sh
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      VERSION_NUM: v1.7.7-1-20261124
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - name: Checkout pinned release with clarity patches
        uses: actions/checkout@v5
        with:
          ref: a925e70deca48f89ac1888fc57003ee215adf9d3
          persist-credentials: false
          submodules: recursive
      - name: Apply patches
        shell: bash
        run: |
          git apply --check crossdesk-modifier-mapping.patch
          git apply crossdesk-modifier-mapping.patch
          git apply --check crossdesk-strict-clarity.patch
          git apply crossdesk-strict-clarity.patch
          git -C deps/submodules/minirtc apply --check ../../../minirtc-strict-clarity.patch
          git -C deps/submodules/minirtc apply ../../../minirtc-strict-clarity.patch
          git diff --check
          git -C deps/submodules/minirtc diff --check
      - name: Select Xcode 26.6
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - name: Cache Xmake dependencies
        uses: actions/cache@v5
        with:
          path: ~/.xmake/packages
          key: crossdesk-clarity-macos-${{ matrix.arch }}-deps-v1
      - name: Ensure Xmake
        uses: ./.github/actions/ensure-xmake
        with:
          minimum-version: "3.1.1"
      - name: Update Xmake repos
        run: xmake repo -u
      - name: Build CrossDesk
        run: |
          xmake f -p macosx -a ${{ matrix.architecture }} -m release --target_minver=${MACOSX_DEPLOYMENT_TARGET} --CROSSDESK_VERSION=${VERSION_NUM} --USE_CUDA=false -vyD
          xmake b -vy crossdesk
      - name: Package ad-hoc signed app
        run: |
          bash apps/desktop/scripts/macos/${{ matrix.script }} "${VERSION_NUM}"
          pkg="crossdesk-macos-${{ matrix.arch }}-${VERSION_NUM}.pkg"
          verify="$(mktemp -d)"
          pkgutil --expand-full "$pkg" "$verify/expanded"
          app="$(find "$verify/expanded" -type d -name 'CrossDesk.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict "$app"
          mv "$pkg" "CrossDesk-UltraClear-v1.7.7-macos-${{ matrix.arch }}.pkg"
          shasum -a 256 "CrossDesk-UltraClear-v1.7.7-macos-${{ matrix.arch }}.pkg"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: CrossDesk-UltraClear-v1.7.7-macos-${{ matrix.arch }}
          path: CrossDesk-UltraClear-v1.7.7-macos-${{ matrix.arch }}.pkg
          if-no-files-found: error
          retention-days: 14
